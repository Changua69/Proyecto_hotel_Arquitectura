# MongoDB 8.0 como replica set de un nodo (necesario para transacciones).
# Alternativa a convertir la instalación local en replica set.
# Uso: docker compose up -d   (detenga antes el servicio MongoDB local si usa el puerto 27017)
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_datos:/data/db
    healthcheck:
      # Inicia el replica set la primera vez; después solo comprueba que responde.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 30s
      retries: 30

volumes:
  mongo_datos:
